<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Gemelo Digital</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <span class="logo-badge">Sistema de Monitoreo</span>
                <h2>Nuevo Usuario</h2>
                <p>Crea una cuenta para acceder a la plataforma</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('registro') }}">
                <div class="form-group">
                    <label for="numero_empleado">Número de Empleado</label>
                    <input type="text" id="numero_empleado" name="numero_empleado" required placeholder="Ej. 4001">
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Carlos Mendoza">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="rol_id">Rol asignado</label>
                    <select id="rol_id" name="rol_id" required>
                        <option value="" disabled selected>Selecciona un rol...</option>
                        {% for rol in roles %}
                            <option value="{{ rol['id'] }}">{{ rol['nombre'] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn-primary">Registrar Usuario</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="{{ url_for('login') }}" style="color: var(--primary-blue); font-size: 0.9rem; text-decoration: none; font-weight: 600;">
                    ← Volver al inicio de sesión
                </a>
            </div>
        </div>
    </div>
</body>
</html>
